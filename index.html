<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Suporte — Nola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0E0E10;
      --surface1:  #1A1A1D;
      --surface2:  #242428;
      --surface3:  #323237;
      --coral:     #FF5A5F;
      --coral-dk:  #e04449;
      --coral-glow: rgba(255,90,95,0.18);
      --coral-border: rgba(255,90,95,0.28);
      --white:     #F7F7F8;
      --muted:     #8A8A96;
      --green:     #22C55E;
      --radius:    14px;
      --radius-sm: 9px;
      --font:      'Inter', system-ui, sans-serif;
      --chat-w:    700px;
      --chat-h:    550px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Fundo limpo com glow coral sutil estático atrás do chat */
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(255,90,95,0.07), transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%, rgba(255,90,95,0.04), transparent 60%),
        var(--bg);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 56px;
      background: rgba(14,14,16,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      user-select: none;
    }
    .logo-dots { display: flex; align-items: center; gap: 4px; }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--coral);
    }
    .logo-text {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--white);
    }

    .header-center {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .restaurant-name { font-size: 13px; font-weight: 500; color: var(--muted); }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--coral);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: var(--white);
      flex-shrink: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 40px 20px 24px;
      gap: 24px;
    }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

    .hero { text-align: center; max-width: var(--chat-w); width: 100%; }
    .hero-title {
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.6px; color: var(--white); line-height: 1.2;
    }
    .hero-sub { margin-top: 8px; font-size: 15px; color: var(--muted); }

    .quick-pills {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      max-width: var(--chat-w); width: 100%;
    }

    .pill {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 18px;
      background: var(--surface1);
      border: 1px solid var(--surface2);
      border-radius: 100px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
      user-select: none;
    }
    .pill:hover {
      border-color: var(--coral-border);
      color: var(--white);
      box-shadow: 0 0 14px var(--coral-glow);
      transform: translateY(-1px);
    }
    .pill:active { transform: translateY(0); }
    .pill-icon { font-size: 14px; line-height: 1; }

    .chat-wrap {
      width: 100%;
      max-width: var(--chat-w);
      height: var(--chat-h);
      border-radius: var(--radius);
      border: 1px solid var(--coral-border);
      box-shadow:
        0 0 0 1px rgba(255,90,95,0.06),
        0 8px 40px rgba(0,0,0,0.5),
        0 0 60px rgba(255,90,95,0.06);
      background: var(--surface1);
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface2);
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
      background: rgba(26,26,29,0.8);
    }
    .chat-header-icon {
      width: 38px; height: 38px;
      border-radius: 50%; background: var(--coral);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .chat-header-info { flex: 1; }
    .chat-header-title { font-size: 14px; font-weight: 600; color: var(--white); line-height: 1.2; }
    .chat-header-sub {
      font-size: 11.5px; color: var(--green);
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }

    .online-dot {
      width: 7px; height: 7px;
      border-radius: 50%; background: var(--green);
      display: inline-block;
      animation: pulse-online 2.2s ease-in-out infinite;
    }
    @keyframes pulse-online {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
      50%       { opacity: 0.6; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
    }

    #messages {
      flex: 1; overflow-y: auto;
      padding: 20px 18px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.bot  { align-items: flex-start; }

    @keyframes bubble-user-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bubble-bot-in {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bubble {
      max-width: 80%; padding: 11px 15px;
      border-radius: 16px; font-size: 13.5px;
      line-height: 1.6; word-break: break-word;
    }
    .bubble.user {
      background: var(--coral); color: var(--white);
      border-bottom-right-radius: 4px;
      animation: bubble-user-in 0.28s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    .bubble.bot {
      background: var(--surface2); color: var(--white);
      border-bottom-left-radius: 4px;
      animation: bubble-bot-in 0.3s cubic-bezier(0.34,1.3,0.64,1) both;
    }
    .bubble.error {
      background: rgba(255,90,95,0.08);
      border: 1px solid rgba(255,90,95,0.25);
      color: #FF9093;
    }
    .bubble strong { font-weight: 700; }
    .bubble ol, .bubble ul {
      padding-left: 18px; display: flex;
      flex-direction: column; gap: 4px; margin-top: 6px;
    }
    .bubble li { font-size: 13.5px; }
    .bubble br { display: block; content: ''; margin-top: 3px; }

    .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; padding: 0 4px; }

    .typing-indicator {
      display: flex; align-items: flex-start;
      animation: bubble-bot-in 0.25s ease-out both;
    }
    .typing-bubble {
      background: var(--surface2);
      border-radius: 16px; border-bottom-left-radius: 4px;
      padding: 13px 16px; display: flex; align-items: center; gap: 5px;
    }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: typing-seq 1.3s ease-in-out infinite;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes typing-seq {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-5px); opacity: 1; }
    }

    .chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--surface2);
      display: flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
      background: rgba(26,26,29,0.7);
    }
    .chat-input-row { display: flex; align-items: flex-end; gap: 9px; }

    #chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid var(--surface3);
      border-radius: 10px;
      color: var(--white);
      font-family: var(--font);
      font-size: 13.5px;
      padding: 10px 14px;
      resize: none; outline: none;
      min-height: 42px; max-height: 110px;
      line-height: 1.5;
      transition: border-color 0.18s, box-shadow 0.18s;
      overflow-y: auto;
      caret-color: var(--coral);
    }
    #chat-input::placeholder { color: var(--muted); }
    #chat-input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(255,90,95,0.12);
    }
    #chat-input:disabled { opacity: 0.45; cursor: not-allowed; }

    @keyframes input-shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-4px); }
      40%  { transform: translateX(4px); }
      60%  { transform: translateX(-3px); }
      80%  { transform: translateX(2px); }
      100% { transform: translateX(0); }
    }
    .input-shake { animation: input-shake 0.35s ease-out; }

    #send-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      background: var(--coral); border: none; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      color: white;
    }
    #send-btn:hover {
      background: var(--coral-dk);
      transform: scale(1.06);
      box-shadow: 0 4px 16px rgba(255,90,95,0.4);
    }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: var(--surface3); cursor: not-allowed; transform: none; box-shadow: none; }
    #send-btn svg { pointer-events: none; }

    .char-counter {
      font-size: 10.5px; color: var(--muted);
      text-align: right; opacity: 0.7;
      transition: color 0.2s; user-select: none;
    }
    .char-counter.warning { color: #FF9093; opacity: 1; }

    footer {
      text-align: center; padding: 10px 20px;
      font-size: 11.5px; color: var(--muted);
      opacity: 0.6; flex-shrink: 0; letter-spacing: 0.01em;
    }

    @media (max-width: 740px) {
      :root { --chat-w: 100%; --chat-h: calc(100dvh - 220px); }
      main { padding: 24px 12px 16px; gap: 18px; }
      .hero-title { font-size: 22px; }
      header { padding: 0 16px; }
      .header-center { display: none; }
      .restaurant-name { display: none; }
    }
  </style>
</head>
<body>

<div id="app">

  <header>
    <a class="logo" href="#">
      <div class="logo-dots">
        <span class="logo-dot"></span>
        <span class="logo-dot"></span>
        <span class="logo-dot"></span>
      </div>
      <span class="logo-text">nola</span>
    </a>
    <span class="header-center">Central de Suporte</span>
    <div class="header-right">
      <span class="restaurant-name">Restaurante Tapí</span>
      <div class="avatar">R</div>
    </div>
  </header>

  <main>

    <div class="hero">
      <h1 class="hero-title">Olá, Restaurante Tapí 👋</h1>
      <p class="hero-sub">Como podemos te ajudar hoje?</p>
    </div>

    <div class="quick-pills">
      <button class="pill" data-shortcut="Preciso de ajuda com PDV / Caixa">
        <span class="pill-icon">📟</span> PDV / Caixa
      </button>
      <button class="pill" data-shortcut="Tenho uma dúvida sobre Financeiro">
        <span class="pill-icon">💰</span> Financeiro
      </button>
      <button class="pill" data-shortcut="Preciso de ajuda com Estoque">
        <span class="pill-icon">📦</span> Estoque
      </button>
    </div>

    <div class="chat-wrap">
      <div class="chat-header">
        <div class="chat-header-icon">💬</div>
        <div class="chat-header-info">
          <div class="chat-header-title">Suporte Nola</div>
          <div class="chat-header-sub">
            <span class="online-dot"></span>
            Online agora&nbsp;·&nbsp;Resposta em segundos
          </div>
        </div>
      </div>

      <div id="messages" role="log" aria-live="polite"></div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea
            id="chat-input"
            placeholder="Digite sua mensagem…"
            rows="1"
            aria-label="Mensagem"
            maxlength="500"
          ></textarea>
          <button id="send-btn" aria-label="Enviar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15.5 2.5L8.5 9.5M15.5 2.5L10.5 15.5L8.5 9.5M15.5 2.5L2.5 7L8.5 9.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="char-counter" id="char-counter">0 / 500</div>
      </div>
    </div>

  </main>

  <footer>
    Atendimento ativo 24/7 &nbsp;·&nbsp; Resposta em até 2 minutos
  </footer>

</div>

<script>
  /* ── CONFIGURAÇÃO ───────────────────────────────────────────── */
  // SUBSTITUIR pela URL real do Webhook do N8N quando estiver pronta
  const WEBHOOK_URL = 'https://yoshikatsu.app.n8n.cloud/webhook/nola-chat';
  const SESSION_ID  = 'nola-' + Math.random().toString(36).slice(2, 11) + '-' + Date.now();

  /* ── DOM ────────────────────────────────────────────────────── */
  const msgContainer = document.getElementById('messages');
  const input        = document.getElementById('chat-input');
  const sendBtn      = document.getElementById('send-btn');
  const charCounter  = document.getElementById('char-counter');
  const MAX_CHARS    = 500;

  function now() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    const target = msgContainer.scrollHeight;
    const start  = msgContainer.scrollTop;
    const diff   = target - start;
    const dur    = 260;
    let startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      const progress = Math.min((ts - startTime) / dur, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      msgContainer.scrollTop = start + diff * ease;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function parseMarkdown(text) {
    const escaped = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const lines = escaped.split('\n');
    let inList = false, result = '', listItems = [];
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^(\d+)\.\s+(.+)/);
      if (m) { inList = true; listItems.push(m[2]); }
      else {
        if (inList) {
          result += '<ol>' + listItems.map(li => `<li>${li}</li>`).join('') + '</ol>';
          listItems.length = 0; inList = false;
        }
        result += lines[i] + (i < lines.length - 1 ? '\n' : '');
      }
    }
    if (inList && listItems.length)
      result += '<ol>' + listItems.map(li => `<li>${li}</li>`).join('') + '</ol>';
    result = result.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    result = result.replace(/\n/g, '<br>');
    return result;
  }

  function appendMessage(text, role, isError = false) {
    const row    = document.createElement('div');
    row.className = 'msg-row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role + (isError ? ' error' : '');
    if (role === 'bot') { bubble.innerHTML = parseMarkdown(text); }
    else { bubble.textContent = text; bubble.style.whiteSpace = 'pre-wrap'; }
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();
    row.appendChild(bubble);
    row.appendChild(time);
    msgContainer.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping() {
    const row    = document.createElement('div');
    row.className = 'typing-indicator';
    row.id        = 'typing';
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'typing-dot';
      bubble.appendChild(dot);
    }
    row.appendChild(bubble);
    msgContainer.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function shakeInput() {
    input.classList.remove('input-shake');
    void input.offsetWidth;
    input.classList.add('input-shake');
    input.addEventListener('animationend', () => input.classList.remove('input-shake'), { once: true });
  }

  function updateCharCounter() {
    const len = input.value.length;
    charCounter.textContent = `${len} / ${MAX_CHARS}`;
    charCounter.classList.toggle('warning', len > 450);
  }

  async function sendMessage(textOverride) {
    const text = (textOverride || input.value).trim();
    if (!text) return;
    appendMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    updateCharCounter();
    shakeInput();
    input.disabled = true;
    sendBtn.disabled = true;
    showTyping();
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: text, sessionId: SESSION_ID })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const reply = data.output || data.message || data.text
        || (typeof data === 'string' ? data : 'Resposta recebida.');
      removeTyping();
      appendMessage(reply, 'bot');
    } catch (err) {
      console.error('[nola-chat] erro:', err);
      removeTyping();
      appendMessage('Ops! Tive um problema de conexão. Tenta de novo em instantes.', 'bot', true);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const s = pill.dataset.shortcut;
      if (s) sendMessage(s);
    });
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    updateCharCounter();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', () => sendMessage());

  window.addEventListener('DOMContentLoaded', () => {
    const welcome = [
      'Olá! Sou o assistente virtual da Nola 😊 Como posso te ajudar hoje?',
      '',
      '1. PDV / Caixa',
      '2. Pedidos / Comandas',
      '3. Financeiro',
      '4. Estoque / Compras',
      '5. Erro ou bug no sistema',
      '6. Falar com um analista de CS',
      '',
      'Você também pode digitar sua dúvida diretamente.'
    ].join('\n');
    setTimeout(() => appendMessage(welcome, 'bot'), 420);
  });
</script>
</body>
</html>
